<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="PurePulse logo">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A066FF"/>
      <stop offset="1" stop-color="#7B2FFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" rx="240" fill="#07070D"/>
  <circle cx="600" cy="510" r="265" fill="none" stroke="#7B2FFF" stroke-width="18" opacity=".23" stroke-dasharray="18 30"/>
  <circle cx="600" cy="510" r="188" fill="none" stroke="#00D4FF" stroke-width="14" opacity=".55" stroke-dasharray="18 36"/>
  <circle cx="600" cy="510" r="104" fill="none" stroke="#A066FF" stroke-width="12" opacity=".48" stroke-dasharray="12 28"/>
  <g fill="url(#pulse)" filter="url(#glow)">
    <circle cx="600" cy="510" r="42"/>
    <circle cx="840" cy="398" r="19"/>
    <circle cx="430" cy="688" r="16"/>
  </g>
  <circle cx="600" cy="510" r="13" fill="#F4F4FF"/>
  <text x="600" y="910" text-anchor="middle" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="136" font-weight="700" letter-spacing="-8"><tspan fill="#F4F4FF">Pure</tspan><tspan fill="#A066FF">Pulse</tspan></text>
  <text x="600" y="990" text-anchor="middle" fill="#F4F4FF" opacity=".56" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600" letter-spacing="10">WEB DESIGN</text>
</svg>
